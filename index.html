// CONFETTI
function createConfettiBurst(count = 1000) {
    const colors = ['#ff5e7e','#ffd166','#8ce99a','#7bdff6','#cba6ff','#fff6a8'];
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const c = document.createElement('div');
            c.className = 'confetti';

            const w = 3 + Math.random() * 14;
            const h = 6 + Math.random() * 20;
            c.style.width = w + 'px';
            c.style.height = h + 'px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];

            c.style.left = Math.random() * vw + 'px';
            c.style.top = -(Math.random() * 100 + 100) + 'px';

            const startRot = Math.random() * 360;
            const spin = (Math.random() - 0.5) * 120; // ⬅️ MUCH smaller rotation
            const drift = (Math.random() - 0.5) * 120;
            const duration = 8000 + Math.random() * 3000;

            c.style.transform = `rotate(${startRot}deg)`;
            c.style.animation = `confetti-fall-${i} ${duration}ms cubic-bezier(.25,.6,.3,1) forwards`;

            const styleEl = document.createElement('style');
            styleEl.textContent = `
                @keyframes confetti-fall-${i} {
                    to {
                        transform:
                            translate(${drift}px, ${vh + 300}px)
                            rotate(${startRot + spin}deg);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(styleEl);

            document.body.appendChild(c);

            c.addEventListener('animationend', () => {
                c.remove();
                styleEl.remove();
            });
        }, i * 6);
    }
}
